kind = "web"
previewPath = "/"
title = "Minecraft Bot"
description = "A public Minecraft AFK bot service with a minimal GET / health response."
version = "1.0.0"
id = "artifacts/minecraft-bot-public"
router = "path"

[[services]]
name = "Minecraft AFK Bot"
paths = ["/"]
localPort = 3000

[services.development]
run = "HOST=0.0.0.0 PORT=3000 MC_AUTO_START=true pnpm --filter @workspace/minecraft-afk-bot run start"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/minecraft-afk-bot", "run", "start"]

[services.production.run.env]
HOST = "0.0.0.0"
PORT = "3000"
MC_AUTO_START = "true"

[services.production.health.startup]
path = "/"
