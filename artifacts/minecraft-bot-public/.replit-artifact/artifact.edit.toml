kind = "web"
previewPath = "/"
title = "Minecraft Bot"
description = "A public Minecraft bot service with a minimal GET / health response and a read-only status page."
version = "1.0.0"
id = "artifacts/minecraft-bot-public"
router = "path"

[[services]]
name = "web"
paths = ["/dashboard"]
localPort = 23307

[services.development]
run = "pnpm --filter @workspace/minecraft-bot-public run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/minecraft-bot-public", "run", "build"]
serve = "static"
publicDir = "artifacts/minecraft-bot-public/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23307"
BASE_PATH = "/"

[[services]]
name = "Minecraft AFK Bot"
paths = ["/"]
localPort = 3000

[services.development]
run = "HOST=0.0.0.0 PORT=3000 MC_AUTO_START=true pnpm --filter @workspace/minecraft-afk-bot run start"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/minecraft-afk-bot", "run", "start"]

[services.production.run.env]
HOST = "0.0.0.0"
PORT = "3000"
MC_AUTO_START = "true"

[services.production.health.startup]
path = "/"
